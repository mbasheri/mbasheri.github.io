<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manan Basheri</title>
<meta name="description" content="Manan Basheri — undergraduate at the University of Waterloo studying Accounting, Finance, and Data Analytics.">
<meta name="theme-color" content="#FCFBF9">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..600;1,6..96,400..500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FCFBF9;                  /* plain near-white */
    --ink:#1A1720;                    /* near-black text */
    --muted:#847F88;                  /* quiet gray */
    --hair:rgba(26,23,32,.10);        /* faint hairline */
    --font:"Bodoni Moda",Didot,"Times New Roman",serif;
    --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    --code-str:#7A4B2C;               /* brown string literal */
    --cursor:#8A2B2B;                 /* maroon terminal cursor */
    --olive:#7C7660;                  /* muted olive nav */
    --olive-dk:#514C36;               /* darker olive on hover/active */
    --pad:clamp(1.5rem,5vw,3rem);
    --ease:cubic-bezier(.22,.68,.28,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--font);
    font-size:clamp(17px,1.1vw,18.5px);
    line-height:1.75;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    min-height:100vh;
  }
  a{color:inherit;text-decoration:none}
  ::selection{background:rgba(26,23,32,.1)}
  :focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:2px}

  /* ── fixed thin top header (print-statement wordmark) ── */
  .nav{
    position:fixed;top:0;left:0;right:0;z-index:20;
    display:flex;justify-content:flex-end;
    padding:.85rem var(--pad);
    background:var(--paper);
    border-bottom:1px solid var(--hair);
  }
  .header-inner{display:flex;flex-direction:column;align-items:flex-end;gap:.45rem}
  .wordmark{
    font-family:var(--mono);
    font-size:.95rem;
    font-weight:500;
    color:var(--ink);           /* print( ) in near-black */
    white-space:nowrap;
  }
  .wordmark .str{color:var(--code-str)}   /* "Manan Basheri" in purple */
  .cursor{
    display:inline-block;
    width:2px;height:1.05em;
    margin-left:2px;
    background:var(--cursor);
    vertical-align:-.16em;
    animation:blink 1s step-end infinite;
  }
  @keyframes blink{from,to{opacity:1}50%{opacity:0}}

  .nav-links{display:flex;gap:1.5rem}
  .nav-links a{
    font-family:var(--mono);
    font-size:.78rem;
    letter-spacing:.02em;
    color:var(--olive);
    padding-bottom:2px;
    border-bottom:1px solid transparent;
    transition:color .25s var(--ease),border-color .25s var(--ease);
  }
  .nav-links a:hover,
  .nav-links a:focus-visible{color:var(--olive-dk);border-color:var(--olive-dk)}

  /* ── content column ──────────────────────────────── */
  main{
    padding:calc(4.75rem + clamp(4rem,12vh,7rem)) var(--pad) clamp(3rem,8vh,5rem);
    max-width:calc(38rem + var(--pad) * 2);
  }
  .col{max-width:38rem;animation:rise .8s var(--ease) both}

  .bio p{margin-bottom:1.35rem}
  .bio p:last-child{margin-bottom:0}

  /* social / contact icons near the bottom of the bio */
  .social{
    display:flex;align-items:center;gap:1.4rem;
    margin-top:2.4rem;
  }
  .social a{
    display:inline-flex;color:var(--muted);
    transition:color .25s var(--ease),transform .25s var(--ease);
  }
  .social a:hover,.social a:focus-visible{color:var(--ink)}
  .social svg{width:20px;height:20px;display:block}

  /* ── projects ────────────────────────────────────── */
  .projects{margin-top:clamp(3.5rem,9vh,5.5rem)}
  .label{
    font-size:.78rem;font-weight:500;
    letter-spacing:.2em;text-transform:uppercase;
    color:var(--muted);
    margin-bottom:1.6rem;
  }
  .proj{margin-bottom:1.8rem}
  .proj:last-child{margin-bottom:0}
  .proj-name{
    font-size:1.28rem;
    display:inline-flex;align-items:center;gap:.4rem;
    border-bottom:1px solid var(--hair);
    padding-bottom:1px;
    transition:border-color .25s var(--ease);
  }
  .proj-name .arw{font-size:.9em;color:var(--muted);transition:transform .25s var(--ease),color .25s var(--ease)}
  .proj-name:hover{border-color:var(--ink)}
  .proj-name:hover .arw{color:var(--ink);transform:translate(2px,-2px)}
  .proj-desc{
    margin-top:.5rem;
    color:var(--muted);
    max-width:34rem;
    line-height:1.65;
  }

  /* ── footer ──────────────────────────────────────── */
  footer{
    margin-top:clamp(4rem,11vh,7rem);
    padding-top:1.5rem;
    border-top:1px solid var(--hair);
    font-size:.82rem;
    letter-spacing:.04em;
    color:var(--muted);
    line-height:1.9;
  }
  footer a{border-bottom:1px solid transparent;transition:color .25s var(--ease),border-color .25s var(--ease)}
  footer a:hover{color:var(--ink);border-color:var(--ink)}

  @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

  @media (max-width:560px){
    .wordmark{font-size:.86rem}
    .nav-links{gap:1.25rem}
    .nav-links a{font-size:.74rem;letter-spacing:.02em}
  }
  @media (prefers-reduced-motion:reduce){
    html{scroll-behavior:auto}
    .col{animation:none}
    *{transition:none!important}
  }
</style>
</head>
